name: Validate AniWatch

on:
  push:
    branches: [main, redesign/product-audit-2026-11-08]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0 | sort -z)
          node --check sw.js

      - name: Run project regression checks
        run: npm run check

      - name: Verify production build
        env:
          SITE_URL: https://aniwatch1.ru
        run: npm run build
